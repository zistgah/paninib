[package]
name = "panini"
version = "0.1.0"
edition = "2021"
description = "PANINI genetic compiler platform: intent → typed Bio-IR → CISC → RISC → microcode, with a parallel digital-twin backend."
license = "Apache-2.0"

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
thiserror = "=1.0.57"
sha2 = "=0.10.8"
hex = "=0.4.3"
indexmap = { version = "=2.2.6", features = ["serde"] }
